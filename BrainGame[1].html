<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1b2e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>BrainGame</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Prompt:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first study arcade. One column, glass panels over a themed aurora.
   Mitr (rounded Thai display) for numbers + headings, Prompt for reading. */
@property --p{syntax:'<number>';initial-value:0;inherits:false}
:root{--a:#14b8a6;--b:#3b82f6;--gold:#ffd166;--ink:#f3f1ff;--mute:#a9a5d1;--glass:rgba(255,255,255,.08);--glass2:rgba(255,255,255,.14);--line:rgba(255,255,255,.14);--g1:#0e7490;--g2:#1d4ed8;--bg:#0b1b2e;--pn:#10243b;--ok:#1fa463;--no:#d64550;--fd:'Mitr','Prompt',sans-serif;--fb:'Prompt','Noto Sans Thai',system-ui,sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);font-family:var(--fb);display:flex;justify-content:center;align-items:center;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;color:var(--ink)}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{width:100%;max-width:480px;height:100vh;height:100dvh;position:relative;overflow:hidden;background:radial-gradient(620px 420px at 90% -8%,var(--g1) 0,transparent 62%),radial-gradient(520px 420px at -12% 104%,var(--g2) 0,transparent 58%),var(--bg);transition:background .4s}
#app:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.4px);background-size:22px 22px;mask-image:linear-gradient(#000,transparent 70%);-webkit-mask-image:linear-gradient(#000,transparent 70%);pointer-events:none}
@media(min-width:520px){#app{height:min(100dvh,900px);border-radius:34px;border:1px solid var(--line);box-shadow:0 30px 80px #0009}}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px calc(env(safe-area-inset-bottom,0px) + 16px);animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fl{50%{transform:translateY(-10px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:none;opacity:1}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top h2{margin:0;font:500 24px var(--fd);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{width:42px;height:42px;border-radius:14px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);transition:.15s;padding:0;flex:none}
.ic:active,.card:active,.btn:active,.opt:active,.row:active{transform:scale(.97)}
input{user-select:text;-webkit-user-select:text}
.fld{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:16px var(--fb);margin-bottom:12px;outline:0}
.sheet{position:absolute;inset:0;z-index:9;display:flex;align-items:flex-end;background:#000b;animation:in .2s}
.sheet>div{width:100%;max-height:88%;overflow:auto;background:var(--pn);border-radius:28px 28px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom,0px) + 22px);border-top:1px solid var(--line);line-height:1.7;font-size:15px;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet h3{margin:0 0 10px;font:500 22px var(--fd)}.sheet h4{margin:20px 0 8px;font:500 16px var(--fd);color:var(--gold)}.sheet li{margin-bottom:4px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#0b1b2e;padding:10px 18px;border-radius:20px;z-index:20;font-weight:600;font-size:14px;animation:pop .3s;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--mute);font-size:13px;margin:-6px 0 14px}
.btn{border:0;border-radius:16px;padding:14px 22px;font:600 16px var(--fb);color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 8px 20px color-mix(in srgb,var(--a) 35%,transparent);transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.g{background:var(--glass);border:1px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.4;cursor:default}
.bar{display:flex;gap:10px;margin-top:14px}.bar .btn{flex:1}
/* home */
.hi{flex:1;min-width:0;line-height:1.25}.hi small{display:block;color:var(--mute);font-size:12px}.hi b{font:500 19px var(--fd);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat{display:flex;gap:14px;padding:16px;border-radius:24px;background:linear-gradient(135deg,var(--glass2),var(--glass));border:1px solid var(--line);margin-bottom:18px}
.stat .l{flex:1;min-width:0}.lvl{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.lv{font:600 15px var(--fd);background:var(--gold);color:#2a1a00;padding:5px 11px;border-radius:12px;white-space:nowrap}
.lvl b{display:block;font:500 15px var(--fd);line-height:1.2}.lvl small,.mute{color:var(--mute);font-size:12px}
.xp{height:9px;border-radius:9px;background:#ffffff1c;overflow:hidden;margin-bottom:6px}.xp i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--gold),#fff)}
.stat .r{display:flex;flex-direction:column;gap:8px;align-items:stretch;justify-content:center;min-width:92px}
.pill{display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:14px;background:#0003;font:500 14px var(--fd);white-space:nowrap}
.pill .i{width:18px;height:18px;color:var(--gold)}.pill.f .i{color:#ff8a4c}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 10px}.sec b{font:500 17px var(--fd)}.sec small{color:var(--mute);font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;overflow:auto;padding-bottom:8px;flex:1;align-content:start}
.card{border:0;text-align:left;border-radius:24px;padding:16px;min-height:168px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 12px 26px #0006;transition:.15s;color:#fff;text-shadow:0 1px 6px #0004}
.card .gl{position:absolute;top:2px;right:12px;font:500 64px/1.1 var(--fd);opacity:.95;filter:drop-shadow(0 6px 10px #0004)}
.card:after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;background:#ffffff1f;right:-40px;top:-40px}
.card b{font:500 20px var(--fd);position:relative;z-index:1}.card span:not(.gl){font-size:12px;opacity:.9;position:relative;z-index:1}
.mini{height:6px;border-radius:6px;background:#0004;margin:12px 0 5px;overflow:hidden;position:relative;z-index:1}.mini i{display:block;height:100%;background:#fff;border-radius:6px}
.card small{font-size:11px;opacity:.9;position:relative;z-index:1}
/* topics */
.list{display:flex;flex-direction:column;gap:12px;overflow:auto;flex:1}
.row{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;background:var(--glass);border:1px solid var(--line);cursor:pointer;transition:.15s;width:100%;text-align:left}
.row .n{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font:500 19px var(--fd);flex:none;color:#fff}
.row .t{flex:1;min-width:0}.row b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{color:var(--mute)}
.badge{font:500 12px var(--fd);padding:4px 10px;border-radius:20px;background:#0003;white-space:nowrap}.badge.ok{background:color-mix(in srgb,var(--ok) 35%,transparent);color:#c9ffe2}
.read{flex:1;overflow:auto;background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:22px;line-height:1.9;font-size:16px}
.read h3{margin:0 0 12px;font:500 24px var(--fd)}
.tag{display:inline-block;font-size:12px;padding:3px 11px;border-radius:12px;color:#fff;margin-bottom:12px;font-weight:600}
.chips{display:flex;gap:8px;margin-top:12px;align-items:center}.chips small{color:var(--mute);margin-right:4px}
.ch{border:1px solid var(--line);background:var(--glass);border-radius:14px;padding:7px 14px;font:500 14px var(--fb);cursor:pointer}.ch.on{background:var(--gold);color:#2a1a00;border-color:var(--gold)}
/* hero / splash */
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.brain{width:132px;height:132px;animation:fl 3.2s ease-in-out infinite;filter:drop-shadow(0 14px 30px color-mix(in srgb,var(--b) 55%,transparent))}
.logo{font:600 48px var(--fd);background:linear-gradient(135deg,#fff,var(--gold) 60%,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;margin:12px 0 4px;letter-spacing:.5px}
.hero p{color:var(--mute);margin:0 0 40px;line-height:1.7}
.hero .btn{width:100%;font-size:19px;padding:17px}
.sp{width:60px;height:60px;border-radius:50%;border:5px solid #ffffff22;border-top-color:var(--gold);animation:rt 1s linear infinite;margin-bottom:20px}@keyframes rt{to{transform:rotate(360deg)}}
.tip{color:var(--mute);margin:10px 0 0;min-height:24px;font-size:14px}
/* quiz */
.cnt{font:500 20px var(--fd)}.cnt small{color:var(--mute);font-size:14px}
.prog{height:8px;border-radius:8px;background:var(--glass);overflow:hidden;margin-bottom:10px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:8px;transition:.4s}
.qmeta{display:flex;gap:8px;align-items:center;margin-bottom:8px;min-height:32px}
.chip{display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font:500 14px var(--fd)}.chip .i{width:16px;height:16px;color:var(--gold)}
.chip.cb{color:#ffb27a;animation:pop .3s}.chip.cb .i{color:#ff8a4c}.chip.tmr{margin-left:auto}.chip.tmr.warn{color:#ff8b94;border-color:#ff8b94;animation:shake .4s infinite}
.tbar{height:5px;border-radius:5px;background:var(--glass);overflow:hidden;margin-bottom:6px}.tbar i{display:block;height:100%;width:100%;background:var(--gold);border-radius:5px;transition:width .1s linear}
.qwrap{flex:1;overflow:auto;padding-bottom:6px}
.qc{background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:24px 20px;font-size:20px;font-weight:600;line-height:1.55;margin:6px 0 16px;text-align:center;animation:pop .35s}
.opt{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:10px;padding:13px 14px;border-radius:18px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:500 16px var(--fb);text-align:left;cursor:pointer;transition:.15s}
.opt i{width:32px;height:32px;border-radius:11px;background:#ffffff1f;display:flex;align-items:center;justify-content:center;font:500 15px var(--fd);flex:none;font-style:normal}
.opt span{min-width:0;overflow-wrap:anywhere}
.opt.ok{background:var(--ok);border-color:var(--ok);animation:pop .3s}.opt.no{background:var(--no);border-color:var(--no);animation:shake .35s}.opt.gone{opacity:.18;pointer-events:none}.opt.dim{opacity:.55}
.fb{flex:1;border-radius:22px;padding:14px 16px;background:var(--pn);border:1px solid var(--line);animation:up .25s}
.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--no)}
.fh{display:flex;align-items:center;gap:8px;font:500 17px var(--fd)}.fb.ok .fh{color:#5ee9a0}.fb.no .fh{color:#ff8b94}
.fb p{margin:6px 0 12px;font-size:14px;line-height:1.7;color:var(--ink);opacity:.9;max-height:120px;overflow:auto}
.fb .btn{width:100%}
/* result */
.ring{--p:0;width:200px;height:200px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:10px 0 16px;background:conic-gradient(var(--gold) calc(var(--p)*1%),#ffffff1a 0);transition:--p 1.3s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 50px color-mix(in srgb,var(--gold) 25%,transparent)}
.ring div{width:158px;height:158px;border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font:600 46px var(--fd);line-height:1.1}.ring small{color:var(--mute)}
.msg{font:500 26px var(--fd);margin-bottom:14px}
.kp{display:flex;gap:10px;margin-bottom:16px;width:100%}
.kp div{flex:1;padding:10px 6px;border-radius:16px;background:var(--glass);border:1px solid var(--line)}.kp b{display:block;font:500 20px var(--fd)}.kp small{color:var(--mute);font-size:11px}
.up{width:100%;padding:12px;border-radius:16px;background:linear-gradient(135deg,var(--gold),#ff9d4c);color:#2a1a00;font:500 16px var(--fd);margin-bottom:12px;animation:pop .5s}
.cf{position:absolute;inset:0;pointer-events:none;z-index:8}
/* sheets & drawer */
.sw{width:54px;height:54px;border-radius:50%;box-shadow:0 0 0 1px #fff3}
.tg{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.bd{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.bd.off{opacity:.4}
.bd .m{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--gold),#ff9d4c);color:#2a1a00;display:flex;align-items:center;justify-content:center;flex:none}.bd.off .m{background:var(--glass2);color:var(--ink)}
.bd small{display:block;color:var(--mute)}
.rv{padding:12px 0;border-bottom:1px solid var(--line)}.rv b{display:block;margin-bottom:4px}.rv .g{color:#5ee9a0}.rv .w{color:#ff8b94}.rv small{display:block;color:var(--mute);margin-top:4px}
.ov{position:absolute;inset:0;background:#000a;z-index:5;animation:in .2s}
.dr{position:absolute;left:0;top:0;bottom:0;width:80%;background:var(--pn);border-right:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 24px) 20px;z-index:6;animation:sl .25s;overflow:auto}
@keyframes sl{from{transform:translateX(-100%)}}
.dr .av{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));display:flex;align-items:center;justify-content:center;font:500 30px var(--fd);margin-bottom:10px}
.dr button.it{display:flex;align-items:center;gap:12px;width:100%;padding:15px 4px;border:0;border-bottom:1px solid var(--line);background:none;font:500 15px var(--fb);cursor:pointer;text-align:left}
.seg{display:flex;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:4px;margin:2px 0 16px}.seg button{flex:1;border:0;background:none;padding:11px;border-radius:14px;font:500 15px var(--fb);cursor:pointer;color:var(--mute);transition:.2s}.seg button.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--a) 35%,transparent)}
.auh{display:flex;align-items:center;gap:14px;margin:2px 0 16px}.auh b{display:block;font:500 22px var(--fd);line-height:1.2}.auh small{color:var(--mute);font-size:13px;line-height:1.5;display:block;margin-top:3px}.auh svg{flex:none}
.sb{width:100%;min-height:50px;border-radius:16px;border:1px solid var(--line);background:var(--glass);font:500 15px var(--fb);display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px;cursor:pointer;color:var(--ink);transition:.15s}.sb:active{transform:scale(.98)}#sa svg{fill:var(--ink)}
.or2{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:13px;margin:8px 0 14px}.or2:before,.or2:after{content:"";flex:1;height:1px;background:var(--line)}
.fl{display:block;margin-bottom:12px}.fl>span{display:block;font-size:12px;color:var(--mute);margin:0 0 6px 4px}
.inp{position:relative}.inp input{width:100%;height:54px;border-radius:16px;border:1px solid var(--line);background:var(--glass);color:var(--ink);padding:0 50px 0 16px;font:16px var(--fb);outline:0;transition:.15s}.inp input:focus{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 25%,transparent)}
.eye{position:absolute;right:5px;top:7px;width:40px;height:40px;border:0;background:none;cursor:pointer;color:var(--mute);display:flex;align-items:center;justify-content:center;border-radius:12px}
.mt{height:6px;border-radius:6px;background:var(--glass);overflow:hidden;margin:-2px 0 6px}.mt i{display:block;height:100%;width:0;transition:.3s;border-radius:6px}.mtl{font-size:12px;color:var(--mute);margin:0 0 12px 4px}
.er{color:#ff8b94;font-size:14px;min-height:22px;margin:2px 4px 8px;line-height:1.5}
.gst{background:none;border:0;color:var(--mute);font:500 14px var(--fb);text-decoration:underline;cursor:pointer;margin:14px auto 0;display:block;padding:6px}
.tm2{font-size:12px;color:var(--mute);text-align:center;margin-top:8px;line-height:1.7}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div>

<button class="sb" id="sg" onclick="socialIn('Google')">${GG} ${up?'สมัครด้วย':'เข้าสู่ระบบด้วย'} Google</button><button class="sb" id="sa" onclick="socialIn('Apple')">${AP} ${up?'สมัครด้วย':'เข้าสู่ระบบด้วย'} Apple</button>
<div class="or2">หรือใช้ชื่อผู้ใช้</div>
<form onsubmit="loginGo();return false" novalidate>
<label class="fl"><span>ชื่อผู้ใช้</span><div class="inp"><input id="lu" value="${esc(pu)}" placeholder="เช่น nattawat_01" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="20"></div></label>
<label class="fl"><span>รหัสผ่าน${up?' (อย่างน้อย 6 ตัว)':''}</span><div class="inp"><input id="lp" type="password" placeholder="••••••" autocomplete="${up?'new-password':'current-password'}" ${up?'oninput="pwm()"':''}><button type="button" class="eye" aria-label="แสดง/ซ่อนรหัสผ่าน" onclick="eye('lp')">${I.eye}</button></div></label>
${up?`<div class="mt"><i id="mi"></i></div><div class="mtl" id="ml">ความแข็งแรงของรหัสผ่าน</div><label class="fl"><span>ยืนยันรหัสผ่าน</span><div class="inp"><input id="lq" type="password" placeholder="••••••" autocomplete="new-password"><button type="button" class="eye" aria-label="แสดง/ซ่อนรหัสผ่าน" onclick="eye('lq')">${I.eye}</button></div></label>`:''}

<button class="gst" onclick="home(1)">เล่นต่อโดยไม่ล็อกอิน</button>
<div class="tm2">${CL()||FBC()?'ข้อมูลของคุณจะถูกบันทึกขึ้นเว็บ เปิดจากเครื่องไหนก็เล่นต่อได้':'ยังไม่ได้ตั้งค่าเว็บเซิร์ฟเวอร์ ข้อมูลจะบันทึกในเครื่องนี้เท่านั้น<br>ตั้งค่าได้ที่ ตั้งค่า → บันทึกขึ้นเว็บ'}</div></div>`)}
function eye(id){const e=document.getElementById(id);e.type=e.type=='password'?'text':'password'}
function pwm(){const v=document.getElementById('lp').value;let s=0;
if(v.length>=6)s++;if(v.length>=10)s++;if((/[a-z]/.test(v)&&/[A-Z]/.test(v))||(/\d/.test(v)&&/[a-zA-Zก-๙]/.test(v)))s++;if(/[^\w\sก-๙]/.test(v))s++;if(v.length<6)s=Math.min(s,1);s=v?Math.max(s,1):0;
const L=['','อ่อน','พอใช้','ดี','แข็งแรง'],C=['','#ff6b78','#ffb454','#7ed957','#34d399'],i=document.getElementById('mi');i.style.width=s*25+'%';i.style.background=C[s];document.getElementById('ml').textContent=s?'รหัสผ่าน'+L[s]:'ความแข็งแรงของรหัสผ่าน'}
async function loginGo(){const up=LM=='up',b=document.getElementById('lc'),lbl=b.textContent,n=document.getElementById('lu').value.trim(),pw=document.getElementById('lp').value,q=up?document.getElementById('lq').value:'';
const er=m=>{document.getElementById('le').textContent=m;b.disabled=false;b.textContent=lbl;return 0};
if(!/^[\w.\-ก-๙]{2,20}$/.test(n))return er('ชื่อผู้ใช้ 2-20 ตัว ใช้ตัวอักษร ตัวเลข _ . - ได้ (ห้ามเว้นวรรค)');
if(up&&pw.length<6)return er('รหัสผ่านต้องมีอย่างน้อย 6 ตัว');if(!up&&!pw)return er('กรุณากรอกรหัสผ่าน');if(up&&pw!==q)return er('รหัสผ่านทั้งสองช่องไม่ตรงกัน');
b.disabled=true;b.textContent='กำลังตรวจสอบ...';
try{const h=await sha(n.toLowerCase()+':'+pw);
if(CL()){const d=await cget(n),ex=d&&d.h;
if(up){if(ex)return er('ชื่อนี้ถูกใช้แล้ว ลองชื่ออื่น หรือสลับไปแท็บเข้าสู่ระบบ');U={n,e:'บันทึกขึ้นเว็บแล้ว',h};sv('bgu',U);await cput(n,{n,h,p:P,t:Date.now()});toast('สร้างบัญชีสำเร็จ')}
else{if(!ex)return er('ไม่พบบัญชีนี้ ลองสมัครสมาชิกก่อน');if(d.h!==h)return er('รหัสผ่านไม่ถูกต้อง');P=Object.assign(DP(),d.p||{});if(P.day!==today()){P.day=today();P.dayAns=0}U={n:d.n||n,e:'บันทึกขึ้นเว็บแล้ว',h};sv('bgu',U);sv('bgp',P);toast('ยินดีต้อนรับกลับ '+U.n)}}
else{const acc=ld('bga',{}),k=n.toLowerCase(),ex=acc[k];
if(up){if(ex)return er('ชื่อนี้ถูกใช้แล้วในเครื่องนี้');acc[k]={n,h,p:P};sv('bga',acc);toast('สร้างบัญชีสำเร็จ')}
else{if(!ex)return er('ไม่พบบัญชีนี้ในเครื่องนี้ ลองสมัครสมาชิกก่อน');if(ex.h!==h)return er('รหัสผ่านไม่ถูกต้อง');P=Object.assign(DP(),ex.p||{});toast('ยินดีต้อนรับกลับ '+ex.n)}
U={n:acc[k].n,e:'บันทึกในเครื่องนี้',h:''};sv('bgu',U);sv('bgp',P)}
home(1)}catch(e){er('เชื่อมต่อเว็บเซิร์ฟเวอร์ไม่ได้ ตรวจ URL ในตั้งค่า และกฎของ database ('+(e.message||'')+')')}}
if(U&&U.h&&CL())cget(U.n).then(d=>{if(d&&d.h===U.h&&d.p&&d.p.xp>P.xp){P=Object.assign(P,d.p);sv('bgp',P)}}).catch(()=>{});
/* ---------- Google / Apple ผ่าน Firebase Authentication ---------- */
const GG='<svg width="22" height="22" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.600 0 6.500 5.400 2.600 13.200l7.900 6.100C12.400 13.600 17.700 9.500 24 9.500z"/><path fill="#4285F4" d="M46.500 24.500c0-1.600-.1-3.100-.4-4.500H24v9h12.700c-.6 3-2.300 5.500-4.800 7.200l7.500 5.800c4.400-4.100 7.100-10.100 7.100-17.500z"/><path fill="#FBBC05" d="M10.500 28.700c-.5-1.400-.8-3-.8-4.700s.3-3.200.8-4.700l-7.900-6.100C.9 16.600 0 20.200 0 24s.9 7.400 2.600 10.800l7.900-6.100z"/><path fill="#34A853" d="M24 48c6.500 0 11.900-2.100 15.900-5.800l-7.500-5.800c-2.200 1.500-5 2.300-8.400 2.300-6.300 0-11.600-4.100-13.500-9.800l-7.900 6.100C6.500 42.600 14.600 48 24 48z"/></svg>';
const AP='<svg width="20" height="20" viewBox="0 0 24 24"><path d="M16.400 12.700c0-2.300 1.900-3.400 2-3.400-1.100-1.600-2.800-1.800-3.400-1.800-1.400-.1-2.800.8-3.500.8s-1.800-.8-3-.8c-1.500 0-3 .9-3.800 2.300-1.600 2.800-.4 7 1.200 9.300.8 1.100 1.700 2.400 2.900 2.300 1.200 0 1.600-.7 3-.7s1.800.7 3 .7 2-1.100 2.800-2.200c.9-1.300 1.200-2.500 1.300-2.600-.1 0-2.500-1-2.500-3.800zM14.100 5.900c.6-.8 1.100-1.900.9-3-.9 0-2.100.6-2.700 1.400-.6.700-1.100 1.800-1 2.900 1.100.1 2.200-.5 2.800-1.300z"/></svg>';
const DP=()=>({xp:0,streak:0,last:'',played:0,right:0,ans:0,best:{},day:'',dayAns:0,subs:{},perfect:0,maxCombo:0,bd:[]});
const FBC=()=>ld('bgf',null);
let FBP=null;
function loadFB(){if(FBP)return FBP;const c=FBC();
FBP=new Promise((ok,no)=>{if(!c||!c.apiKey||!c.authDomain)return no(new Error('ยังไม่ได้ตั้งค่า Firebase (ตั้งค่า → Google / Apple Login)'));
const L=['app','auth','database'];let i=0;
(function nx(){if(i>=L.length){try{if(!firebase.apps.length){const cfg=Object.assign({},c);if(!cfg.databaseURL&&CL())cfg.databaseURL=CL();firebase.initializeApp(cfg)}ok(firebase)}catch(e){no(e)}return}
const s=document.createElement('script');s.src='https://www.gstatic.com/firebasejs/10.12.2/firebase-'+L[i++]+'-compat.js';s.onload=nx;s.onerror=()=>no(new Error('โหลด Firebase ไม่ได้ ตรวจอินเทอร์เน็ต'));document.head.appendChild(s)})()});
FBP.catch(()=>{FBP=null});return FBP}
function fbErr(e){const c=e&&e.code||'';return c=='auth/unauthorized-domain'?'โดเมนนี้ยังไม่ได้อนุญาต: Firebase → Authentication → Settings → Authorized domains':c=='auth/operation-not-allowed'?'ยังไม่ได้เปิดผู้ให้บริการนี้ใน Firebase → Authentication → Sign-in method':c=='auth/popup-closed-by-user'||c=='auth/cancelled-popup-request'?'ปิดหน้าต่างล็อกอินก่อนเสร็จ':c=='auth/operation-not-supported-in-this-environment'?'ต้องเปิดผ่านเว็บ https:// หรือ localhost (ไม่ใช่ไฟล์ในเครื่อง)':(e&&e.message)||'ล็อกอินไม่สำเร็จ'}
async function socialIn(p){try{const f=await loadFB(),a=f.auth(),pr=p=='Google'?new f.auth.GoogleAuthProvider():new f.auth.OAuthProvider('apple.com');
if(p=='Apple'){pr.addScope('email');pr.addScope('name')}
let r;try{r=await a.signInWithPopup(pr)}catch(e){if(e.code=='auth/popup-blocked'){await a.signInWithRedirect(pr);return}throw e}
await fbAfter(r.user,p)}catch(e){loginScreen(fbErr(e))}}
async function fbAfter(u,p){U={n:u.displayName||(u.email||'').split('@')[0]||'ผู้เล่น',e:(u.email||p||'บัญชีออนไลน์')+' · บันทึกขึ้นเว็บแล้ว',uid:u.uid,fb:1,h:''};sv('bgu',U);
try{const d=(await firebase.database().ref('accounts/'+u.uid+'/p').get()).val();
if(d&&d.xp>=P.xp){P=Object.assign(DP(),d);if(P.day!==today()){P.day=today();P.dayAns=0}sv('bgp',P);toast('ยินดีต้อนรับกลับ '+U.n)}else{await firebase.database().ref('accounts/'+u.uid).set({n:U.n,p:P,t:Date.now()});toast('บันทึกข้อมูลขึ้นเว็บแล้ว')}}
catch(e){toast('เข้าสู่ระบบแล้ว แต่เชื่อมฐานข้อมูลไม่ได้: '+((e.code||e.message||'')+'').slice(0,40))}
home(1)}
function fbSave(){if(!window.firebase||!firebase.apps.length||!U||!U.uid)return;firebase.database().ref('accounts/'+U.uid).set({n:U.n,p:P,t:Date.now()}).catch(()=>toast('ซิงค์ขึ้นเว็บไม่สำเร็จ ข้อมูลยังอยู่ในเครื่อง'))}
function parseFB(t){const o={};[...t.matchAll(/["']?(apiKey|authDomain|databaseURL|projectId|appId|storageBucket|messagingSenderId)["']?\s*:\s*["']([^"']+)["']/g)].forEach(m=>o[m[1]]=m[2]);return o}
function saveFB(){const t=document.getElementById('fc').value.trim();if(!t){try{localStorage.removeItem('bgf')}catch(e){}document.getElementById('sh').remove();return toast('ลบการตั้งค่า Firebase แล้ว')}
const o=parseFB(t);if(!o.apiKey||!o.authDomain)return toast('ไม่พบ apiKey / authDomain ในข้อความที่วาง');sv('bgf',o);FBP=null;document.getElementById('sh').remove();toast('บันทึกแล้ว ไปกดล็อกอินด้วย Google หรือ Apple ได้เลย')}
if(FBC()&&location.protocol!='file:')loadFB().then(f=>f.auth().getRedirectResult()).then(r=>{if(r&&r.user)fbAfter(r.user,r.additionalUserInfo&&r.additionalUserInfo.providerId)}).catch(()=>{});
start();
</script></body></html>
